landing:
  metadata:
    title: Chương trình Ambassador

  apply: Nộp đơn
  apply-sub: "Chỉ US, UK, CA, EU, AU, NZ"
  log-in: Đăng nhập
  dashboard: Bảng điều khiển

  hero:
    0: Dẫn dắt cộng đồng Hack Club Stardance mùa hè này tại
    1: thành phố của bạn.

  intro:
    start: --- BẮT ĐẦU THÔNG ĐIỆP ---
    0: Mùa hè này, Hack Club hợp tác với NASA, AMD và GitHub để tổ chức thử thách kỹ thuật lớn nhất thế giới, và chúng tôi cần sự giúp đỡ của bạn để tìm ra cách thúc đẩy lượt đăng ký và giúp hàng trăm nghìn học sinh khám phá Hack Club lần đầu tiên.
    1: Nhiệm vụ của bạn, nếu bạn chọn chấp nhận, là đưa các bạn trẻ từ thành phố của bạn đăng ký tham gia Stardance Challenge. Cùng nhau, chúng ta sẽ tìm ra cách đưa <strong>100.000 người dùng</strong> qua mùa hè này!
    2: Đến cuối mùa hè này, bạn sẽ trở thành chuyên gia trong việc thúc đẩy người dùng cho bất cứ điều gì bạn làm trong tương lai. Bạn cũng nhận được áo thun và merch của Hack Club. Thêm vào đó, bạn nhận được <strong>khoản thù lao $100</strong>* và <strong>được trả tiền</strong> cho mỗi poster bạn treo và mỗi lượt đăng ký bạn có được. Tìm thêm thông tin <faq_link>tại đây</faq_link>. <partyparrot></partyparrot>
    3: Sẵn sàng chưa?
    footnote: "*Nếu bạn tổ chức từ 2 buổi meetup trở lên mỗi tháng vào tháng 6, tháng 7 và tháng 8, chúng tôi sẽ trả cho bạn $100 vào cuối tháng 8."
    end: <<EOF

  past-events:
    title: Sự kiện đã qua
    0: Năm 2025, các Hack Clubber trên khắp thế giới đã dành hơn <strong>240.000 giờ lập trình</strong>, xây dựng hơn <strong>23.000 dự án độc đáo</strong>.
    1: Năm 2026, chúng tôi muốn làm tốt hơn nữa.
    flagship:
      title: Campfire Flagship
      desc: Một game jam flagship 3 ngày tại Los Angeles với các YouTuber như Michael Reeves, William Osman và nhiều người khác nữa!
    blueprint:
      title: Blueprint
      desc: Blueprint đã trao $140.000 để tài trợ cho 1.500 dự án phần cứng và điện tử được xây dựng bởi các bạn trẻ.
    midnight:
      title: Midnight
      desc: Một hackathon trinh thám phá án được tổ chức tại Vienna, Áo với hơn 60 bạn trẻ từ khắp nơi trên thế giới!
    siege:
      title: Siege
      desc: Hơn 100 bạn trẻ đã tạo một dự án mỗi tuần trong 10 tuần và nhận được một chiếc laptop Framework.

  past-projects:
    title: Các dự án đã được xây dựng bởi các bạn trẻ trong Hack Club
    by: Bởi
    doom-pdf:
      title: Doom PDF
      desc: "Một bản port mã nguồn của Doom (1993),\nchạy bên trong một tài liệu PDF."
      by: Allen D
    librepods:
      title: LibrePods
      desc: "Airpods được giải phóng khỏi\nhệ sinh thái của Apple."
      by: Kavish D
    vert:
      title: VERT
      desc: "Một tiện ích chuyển đổi file sử dụng\nWebAssembly để chuyển đổi file\ntrên thiết bị thay vì trên cloud."
      by: Maya
    biblically-accurate:
      title: The Biblically Accurate Macropad
      desc: "Một macropad rất macro có hình dạng\ncủa một thiên thần chuẩn theo Kinh Thánh!"
      by: Alex Tran
    specter:
      title: Specter
      desc: "Một trò chơi về một hiệp sĩ dũng cảm\ncố gắng thoát khỏi hang động, nhưng\nbị ám bởi chính hồn ma của mình."
      by: Ayessa
    blind-defusal:
      title: Blind Defusal
      desc: "Một trò chơi hợp tác hai người\n\"gỡ bom\"."
      by: Josh, Brandon & Johnathan

