        title: "Hoàn tất onboarding:"
        body: Onboarding đã xong.
  rejected:
    eyebrow: Thử lại
    title: Đăng ký trở thành Ambassador
    body: "Đơn đăng ký gần nhất của bạn không được chấp nhận, nhưng bạn có thể gửi một đơn mới và chúng tôi sẽ xét duyệt."
