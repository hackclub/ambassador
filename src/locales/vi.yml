    title: Đơn đăng ký đã đóng
    body: "Đơn đăng ký gần nhất của bạn đã bị từ chối vĩnh viễn. Vui lòng gửi email đến ambassadors@hackclub.com nếu bạn nghĩ đây là sai sót."

