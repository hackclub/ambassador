    body-suffix: để mở khóa office grant và đặt áo thun.
    cta: Hoàn tất onboarding
    disabled-title: "Onboarding đang tạm dừng:"
    disabled-body: Onboarding ambassador tạm thời bị vô hiệu hóa. Chúng tôi sẽ thông báo cho bạn khi nó khả dụng trở lại.
    status:
      submitted:
        title: "Đã gửi onboarding:"
        body: Cảm ơn bạn đã gửi thông tin onboarding! Bạn sẽ sớm nhận được hợp đồng qua email.
      pending-signature:
        title: "Hợp đồng đang chờ ký:"
        body: Hợp đồng của bạn đang chờ một hoặc nhiều chữ ký. Vui lòng đảm bảo bạn đã ký và kiên nhẫn chờ trong khi chúng tôi xử lý ở phía mình.
